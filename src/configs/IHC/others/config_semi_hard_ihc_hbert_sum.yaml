data_path: "dataset/preproceessed"
output_base: "output"
seed: !!int 0

encoders:
  - "GroNLP/hateBERT"
learning_rates:
  - !!float 2e-5
lambda_weights:
  - !!float 0.25
batch_size: !!int 8
num_epochs: !!int 6
data_mains:
  - name: "ihc"
    methods:
      - name: "semi-hard"
        d_fn: ["angular", "cos"]
        fallback: [!!bool true]
        margins: [!!float 0.3, !!float 0.4, !!float 0.45]
        reducers:
          - name: "sum"
# reducers            : softmax
