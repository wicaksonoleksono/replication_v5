data_path: "dataset/preproceessed"
output_base: "output"
seed: !!int 0
encoders:
  - "bert-base-uncased"
learning_rates:
  - !!float 2e-5
lambda_weights:
  - !!float 0.25
batch_size: !!int 8
num_epochs: !!int 6
data_mains:
  - name: "ihc"
    methods:
      - name: "semi-hard"
        d_fn: ["angular"]
        margins: [!!float 0.3]
        fallback: [!!bool true]
        reducers:
          - name: "softmax"
            beta_values: [!!int 15]
